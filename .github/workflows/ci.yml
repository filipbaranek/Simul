name: CI

on:
  push:
    # Not tags, and not main: release.yml calls this workflow for those.
    branches: ['**', '!main']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on a branch, never on main.
concurrency:
  group: ci-${{ github.ref_name == 'main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.name }})
    # Pinned: GCC 14 and Clang 18 are the minimum supported compilers.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-14 release
            preset: release
            cxx: g++-14
          - name: gcc-14 asan+ubsan
            preset: asan
            cxx: g++-14
          - name: clang-18 debug
            preset: debug
            cxx: clang++-18
    env:
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DSIMUL_BUILD_SHA=${{ github.sha }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --build-arg SIMUL_BUILD_SHA=${{ github.sha }} -t simul-server:ci .

      - name: Check reported commit
        run: docker run --rm simul-server:ci --version | grep -F ${{ github.sha }}

      - name: Start server
        run: docker run -d --name simul-server -p 7777:7777 simul-server:ci

      # TODO: replace with simul-bot once the protocol exists.
      - name: Check that the server accepts connections
        run: |
          for _ in $(seq 20); do
            timeout 1 bash -c '</dev/tcp/127.0.0.1/7777' && exit 0
            sleep 0.5
          done
          exit 1

      # Exit code 0 means the server stopped on SIGTERM; 137 means it ignored it and was killed.
      - name: Stop server
        run: |
          docker stop --time 5 simul-server
          test "$(docker inspect --format '{{.State.ExitCode}}' simul-server)" = 0

      - name: Server log
        if: always()
        run: docker logs simul-server
